server:
  port: 8004

spring:
  application:
    name: exchange

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUE_URL:http://localhost:8080/realms/master}

  kafka:
    bootstrap-servers: ${KAFKA_URL:localhost:29092}
    admin:
      client-id: exchange-service
      fail-fast: true
    consumer:
      group-id: exchange-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-commit: true
      enable-auto-commit: true
      properties:
        spring.json.trusted.packages: '*'

logging:
  level:
    org.springframework.web.reactive.result.method.annotation.RequestMappingHandlerMapping: TRACE

management:
  endpoints.web.exposure.include: '*'
  endpoint.health.show-details: always