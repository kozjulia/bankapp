replicaCount: 1

image:
  repository: bankapp-blocker
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8002

serviceAccount:
  create: true
  automount: true
  annotations: { }
  name: ""

ingress:
  enabled: true
  className: "nginx"
  annotations: { }
  hosts:
    - host: blocker.test.local
      paths:
        - path: /
          pathType: Prefix
  tls: [ ]

environment:
  KEYCLOAK_ISSUE_URL: http://keycloak:8080/realms/master
  ZIPKIN_TRACING_ENDPOINT: "http://zipkin.{{ .Release.Namespace }}.svc.cluster.local:9411/api/v2/spans"
  ZIPKIN_SAMPLING_PROBABILITY: 1

resources: { }

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80