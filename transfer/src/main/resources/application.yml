server:
  port: 8007

spring:
  application:
    name: transfer

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUE_URL:http://localhost:8080/realms/master}
      client:
        registration:
          transfer-client:
            provider: keycloak
            authorization-grant-type: client_credentials
            client-id: transfer-client
            client-secret: ${CLIENT_SECRET:Sbv2HTFhjQhdlt49JVLukoXH1Dlf05sv}
            scope: accounts.read,accounts.write,blocker.read,exchange.read,notification.write
            client-authentication-method: client_secret_post
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUE_URL:http://localhost:8080/realms/master}

  kafka:
    bootstrap-servers: ${KAFKA_URL:localhost:29092}
    admin:
      client-id: transfer-service
      fail-fast: true
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

client:
  accounts:
    url: ${ACCOUNTS_SERVICE_URL:http://accounts:8001}
  blocker:
    url: ${BLOCKER_SERVICE_URL:http://blocker:8002}
  exchange:
    url: ${EXCHANGE_SERVICE_URL:http://exchange:8004}

logging:
  level:
    org.springframework.web.reactive.result.method.annotation.RequestMappingHandlerMapping: TRACE