server:
  port: 8003

spring:
  application:
    name: cash

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUE_URL:http://localhost:8080/realms/master}
      client:
        registration:
          cash-client:
            provider: keycloak
            authorization-grant-type: client_credentials
            client-id: ${CLIENT_ID:cash-client}
            client-secret: ${CLIENT_SECRET:7NH6aciGchDEY7zy4KkJ5jlnGFXVWJmb}
            scope: accounts.read,accounts.write,blocker.read,notification.write
            client-authentication-method: client_secret_post
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUE_URL:http://localhost:8080/realms/master}

  kafka:
    bootstrap-servers: ${KAFKA_URL:localhost:29092}
    admin:
      client-id: cash
      fail-fast: true
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

client:
  accounts:
    url: ${ACCOUNTS_SERVICE_URL:http://accounts:8001}
  blocker:
    url: ${BLOCKER_SERVICE_URL:http://accounts:8002}

logging:
  level:
    org.springframework.web.reactive.result.method.annotation.RequestMappingHandlerMapping: TRACE